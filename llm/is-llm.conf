[program:is-llm]
command=/workspace/llm/start-pernicious.sh
directory=/workspace/llm
user=root

autostart=true
autorestart=true
startsecs=10
startretries=3

stopsignal=INT
stopasgroup=true
killasgroup=true
stopwaitsecs=60

stdout_logfile=/workspace/llm/logs/supervisor.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3

stderr_logfile=/workspace/llm/logs/supervisor-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3

environment=HOME="/root"
